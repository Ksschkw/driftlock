name: Smoke

# Builds, vets, and runs the test suite. The suite includes the end-to-end
# pipeline test (internal/hook/e2e_test.go), which runs the real git -> parser
# -> diff -> chunk -> HTTP adapter path against a deliberately drifted fixture
# with a stub provider and asserts the pass/fail decision. That is the closest
# thing to running the action itself without a live API key.

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Range mode diffs two refs, so the fixture needs real history.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Golden corpus is up to date
        # Guards against a parser change committed without regenerating goldens.
        run: |
          go test ./internal/parser -run TestGoldenCorpus -update
          if ! git diff --quiet -- internal/parser/testdata; then
            echo "::error::golden corpus is stale; run 'go test ./internal/parser -run TestGoldenCorpus -update' and commit the result"
            git --no-pager diff -- internal/parser/testdata
            exit 1
          fi
