name: 'Driftlock'
description: 'Fail a pull request when its documentation drifts from code (structural API changes not reflected in the docs).'
branding:
  icon: 'lock'
  color: 'purple'

inputs:
  base:
    description: >-
      Base git ref to compare against (the PR target). When empty, the action
      resolves the pull request base, then the push's previous commit.
    required: false
    default: ''
  head:
    description: >-
      Head git ref (the PR tip). When empty, the action resolves the checked-out
      commit.
    required: false
    default: ''
  version:
    description: 'Driftlock version to install (a git tag, or "latest").'
    required: false
    default: 'latest'
  api-key:
    description: 'LLM API key, exposed to Driftlock as $DRIFTLOCK_API_KEY. Pass a repository secret.'
    required: false
    default: ''
  report-only:
    description: 'When "true", report drift without failing the job (exit 0). Useful for gradual adoption.'
    required: false
    default: 'false'
  block-on-llm-error:
    description: >-
      When "true" (the default), a provider outage fails the job instead of
      letting an unverified change through. Set to "false" to warn only.
    required: false
    default: 'true'
  working-directory:
    description: 'Directory containing .driftlock.toml.'
    required: false
    default: '.'

runs:
  using: 'composite'
  steps:
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'
        cache: false

    - name: Install Driftlock
      shell: bash
      run: go install github.com/Ksschkw/driftlock/cmd/driftlock@${{ inputs.version }}

    # GitHub does NOT evaluate ${{ }} expressions in action metadata `default`
    # fields; they are literal strings. The refs are therefore resolved here,
    # where the workflow context is actually available.
    - name: Resolve base and head refs
      id: refs
      shell: bash
      env:
        INPUT_BASE: ${{ inputs.base }}
        INPUT_HEAD: ${{ inputs.head }}
        EVENT_PR_BASE: ${{ github.event.pull_request.base.sha }}
        EVENT_BEFORE: ${{ github.event.before }}
        EVENT_SHA: ${{ github.sha }}
      run: |
        set -euo pipefail

        is_zero_sha() {
          case "$1" in
            ""|0000000000000000000000000000000000000000) return 0 ;;
          esac
          return 1
        }

        base="$INPUT_BASE"
        if [ -z "$base" ]; then base="$EVENT_PR_BASE"; fi
        if [ -z "$base" ] && ! is_zero_sha "$EVENT_BEFORE"; then base="$EVENT_BEFORE"; fi

        head="$INPUT_HEAD"
        if [ -z "$head" ]; then head="$EVENT_SHA"; fi
        if [ -z "$head" ]; then head="HEAD"; fi

        if [ -z "$base" ]; then
          echo "::error::Driftlock could not determine a base ref. Pass 'base' explicitly, e.g. base: \${{ github.event.pull_request.base.sha }}"
          exit 1
        fi

        echo "base=$base" >> "$GITHUB_OUTPUT"
        echo "head=$head" >> "$GITHUB_OUTPUT"
        echo "driftlock: comparing $base..$head"

    - name: Check documentation drift
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        DRIFTLOCK_API_KEY: ${{ inputs.api-key }}
        BLOCK_ON_LLM_ERROR: ${{ inputs.block-on-llm-error }}
        BASE_REF: ${{ steps.refs.outputs.base }}
        HEAD_REF: ${{ steps.refs.outputs.head }}
        REPORT_ONLY: ${{ inputs.report-only }}
      run: |
        set -euo pipefail

        # CI must not pass an unverified change because the provider was
        # unreachable. DRIFTLOCK_STRICT_LLM forces block_on_llm_error and
        # block_on_false regardless of the committed config.
        if [ "$BLOCK_ON_LLM_ERROR" = "true" ]; then
          export DRIFTLOCK_STRICT_LLM=1
        fi

        args=(check --base "$BASE_REF" --head "$HEAD_REF")
        if [ "$REPORT_ONLY" = "true" ]; then
          args+=(--report)
        fi
        driftlock "${args[@]}"
